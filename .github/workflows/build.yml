name: build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android 37 platform
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-9862592_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          SDKMANAGER=/tmp/cmdtools/cmdline-tools/bin/sdkmanager
          yes | $SDKMANAGER --sdk_root=$ANDROID_HOME --licenses > /dev/null
          $SDKMANAGER --sdk_root=$ANDROID_HOME "platforms;android-37.0" "platforms;android-36" "build-tools;36.0.0"

      - name: Build unsigned release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $APK_PATH)" >> "$GITHUB_OUTPUT"

      - name: Verify APK supports 32-bit and 64-bit ARM
        run: |
          APK="${{ steps.apk.outputs.path }}"
          MISSING=0
          for lib in $(unzip -l "$APK" | grep -oE 'lib/[^/]+/[^ ]+\.so$' | sed 's|lib/[^/]*/||' | sort -u); do
            for abi in armeabi-v7a arm64-v8a; do
              if ! unzip -l "$APK" | grep -q "lib/$abi/$lib"; then
                echo "::error::MISSING lib/$abi/$lib"
                MISSING=1
              fi
            done
          done
          if [ "$MISSING" -eq 1 ]; then exit 1; fi
          echo "OK: every native lib ships for both armeabi-v7a (32-bit) and arm64-v8a (64-bit)"
          unzip -l "$APK" | grep -E '\.so$' || echo "APK has no native libs at all"

      - name: Create source zip
        run: |
          git archive --format=zip --output=mpmanager-source.zip HEAD

      - name: Delete old release and tag if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.1.1-ar1 --yes --cleanup-tag 2>/dev/null || true
          git push origin :refs/tags/v1.1.1-ar1 2>/dev/null || true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.1.1-ar1 \
            --title "MP Manager v1.1.1-ar1 (Arabic)" \
            --notes "Custom Arabic build of MP Manager 1.1.1. Unsigned universal APK (32-bit + 64-bit)." \
            "${{ steps.apk.outputs.path }}" mpmanager-source.zip
